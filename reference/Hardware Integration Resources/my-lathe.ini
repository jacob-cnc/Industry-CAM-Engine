# ============================================================================
# LinuxCNC Lathe Configuration
# Mesa 7i96s + 7i85s
# Closed-loop steppers on X and Z with linear encoders
# Spindle with rotary encoder for threading
# 2x MPG handwheels, jog buttons, limit/home switches
# Units: inches
# ============================================================================

[EMC]
VERSION = 1.1
MACHINE = My-Lathe
DEBUG = 0

[DISPLAY]
DISPLAY = /home/linuxcnc/linuxcnc/my-lathe/gui/launch_gui.sh
LATHE = 1
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.5
MIN_SPINDLE_OVERRIDE = 0.25
DEFAULT_SPINDLE_SPEED = 500
PROGRAM_PREFIX = /home/linuxcnc/linuxcnc/nc_files
EDITOR = gedit
INCREMENTS = 0.001 0.005 0.010 0.050 0.100 0.500
GEOMETRY = -XZ
MIN_LINEAR_VELOCITY = 0.0
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 2.0

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3

[RS274NGC]
PARAMETER_FILE = my-lathe.var
SUBROUTINE_PATH = /home/linuxcnc/linuxcnc/nc_files/subroutines
FEATURES = 30

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = my-lathe.hal
HALFILE = custom.hal
POSTGUI_HALFILE = postgui.hal

[HALUI]
# HALUI provides pins for UI interaction (MPG jog select, etc.)

[TRAJ]
COORDINATES = X Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 2.0
DEFAULT_LINEAR_VELOCITY = 1.0
DEFAULT_LINEAR_ACCELERATION = 10.0
MAX_LINEAR_ACCELERATION = 10.0
NO_FORCE_HOMING = 0

# ============================================================================
# JOINT 0 — X AXIS (cross-slide)
# Closed-loop stepper with linear encoder feedback
# ============================================================================
[JOINT_0]
TYPE = LINEAR
HOME = 4.25
MIN_LIMIT = -0.01
MAX_LIMIT = 4.25
MAX_VELOCITY = 2.0
MAX_ACCELERATION = 10.0
STEPGEN_MAXVEL = 2.5
STEPGEN_MAXACCEL = 12.5

# Step timing for UIRobot UIM8696PM integrated closed-loop stepper
STEP_SCALE = 54186.667
DIRSETUP = 20000
DIRHOLD = 20000
STEPLEN = 5000
STEPSPACE = 5000

# Sino KA300/KA500 linear encoder feedback (5µm resolution)
ENCODER_SCALE = 5080

# PID tuning for closed-loop correction
P = 1000.0
I = 0.0
D = 0.0
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = 0.000050
MAX_OUTPUT = 2.5
MAX_ERROR = 0.0005

# Homing — single home switch, software limits only (no physical limit switches)
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0
HOME_IGNORE_LIMITS = YES

# Ferror — following error limits
FERROR = 0.005
MIN_FERROR = 0.001

# ============================================================================
# JOINT 1 — Z AXIS (carriage)
# Closed-loop stepper with linear encoder feedback
# ============================================================================
[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -0.01
MAX_LIMIT = 23.5
MAX_VELOCITY = 2.0
MAX_ACCELERATION = 10.0
STEPGEN_MAXVEL = 2.5
STEPGEN_MAXACCEL = 12.5

# Step timing for UIRobot UIM8696PM integrated closed-loop stepper
STEP_SCALE = 27093.333
DIRSETUP = 20000
DIRHOLD = 20000
STEPLEN = 5000
STEPSPACE = 5000

# Sino KA300/KA500 linear encoder feedback (5µm resolution)
ENCODER_SCALE = 5080

# PID tuning for closed-loop correction
P = 1000.0
I = 0.0
D = 0.0
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = 0.000050
MAX_OUTPUT = 2.5
MAX_ERROR = 0.0005

# Homing — single home switch, software limits only (no physical limit switches)
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_OFFSET = 0.0
HOME_SEQUENCE = 1
HOME_IGNORE_LIMITS = YES

# Ferror — following error limits
FERROR = 0.005
MIN_FERROR = 0.001

# ============================================================================
# AXIS definitions (map joints to axes)
# ============================================================================
[AXIS_X]
MIN_LIMIT = -0.01
MAX_LIMIT = 4.25
MAX_VELOCITY = 2.0
MAX_ACCELERATION = 10.0

[AXIS_Z]
MIN_LIMIT = -0.01
MAX_LIMIT = 23.5
MAX_VELOCITY = 2.0
MAX_ACCELERATION = 10.0

# ============================================================================
# SPINDLE
# Manually controlled electric motor — on/off and speed set by operator
# via headstock gears and levers. No VFD or CNC speed control.
# Rotary encoder on 7i96s TB2 provides feedback for threading/CSS only.
# ============================================================================
[SPINDLE_0]
MAX_FORWARD_VELOCITY = 3000
MIN_FORWARD_VELOCITY = 100
MAX_REVERSE_VELOCITY = 3000
MIN_REVERSE_VELOCITY = 100
HOME_SEARCH_VELOCITY = 0
# Encoder PPR — 1000 PPR × 4 quadrature = 4000 counts/rev
ENCODER_SCALE = 4000

# ============================================================================
# Mesa 7i96s + 7i85s board configuration
# ============================================================================
[MESA]
CARD0 = hm2_eth
BOARD = 7i96s
IP_ADDRESS = 10.10.10.10
