           a4,4 0 1,1 8,0 
           a4,4 0 1,1 8,0 
           a4,4 0 1,1 8,0" 
        fill="none" stroke="#1a5c38" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14,38 
           a4,4 0 1,1 8,0 
           a4,4 0 1,1 8,0 
           a4,4 0 1,1 8,0 
           a4,4 0 1,1 8,0" 
