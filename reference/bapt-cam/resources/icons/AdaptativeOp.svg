  <!-- Tool (small circle with cross) -->
  <circle cx="50" cy="14" r="5" fill="#fff" stroke="#2e8b57" stroke-width="1.5"/>
  <line x1="50" y1="10" x2="50" y2="18" stroke="#2e8b57" stroke-width="1.2"/>
  <line x1="46" y1="14" x2="54" y2="14" stroke="#2e8b57" stroke-width="1.2"/>
