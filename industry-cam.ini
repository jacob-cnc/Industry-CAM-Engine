# ============================================================================
# Industry CAM Engine — LinuxCNC Machine Configuration
# Mesa 7i96s + 7i85s
# Closed-loop steppers on X and Z with linear encoders
# Spindle with rotary encoder for threading
# 2x MPG handwheels, jog buttons, home switches
# Units: inches
# ============================================================================

[EMC]
VERSION = 1.1
MACHINE = Industry-CAM
DEBUG = 0

[DISPLAY]
DISPLAY = /home/jacob/linuxcnc/configs/industry-cam/display_gui.sh
# DISPLAY = axis
LATHE = 1
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.5
MIN_SPINDLE_OVERRIDE = 0.25
DEFAULT_SPINDLE_SPEED = 500
PROGRAM_PREFIX = /home/jacob/linuxcnc/nc_files
EDITOR = gedit
INCREMENTS = 0.0002 0.0005 0.001 0.005 0.010 0.050
GEOMETRY = -XZ
MIN_LINEAR_VELOCITY = 0.0
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 2.0

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[RS274NGC]
PARAMETER_FILE = industry-cam.var
# Lathe startup modes (LinuxCNC defaults are G8 radius + G17 XY plane):
#   G7  - diameter mode, so MDI, touch-off, G10 L1 and programs that omit G7 all
#         read X words as DIAMETER (project convention; see
#         .kiro/steering/linuxcnc-gcode-reference.md)
#   G18 - ZX plane, so MDI arcs (G2/G3) are in the lathe plane
# Before 2026-11-08 the controller started in G8 G17.
RS274NGC_STARTUP_CODE = G7 G18
SUBROUTINE_PATH = /home/jacob/linuxcnc/nc_files/subroutines
FEATURES = 30

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 2000000

[KINS]
KINEMATICS = trivkins coordinates=XZ
JOINTS = 2

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = industry-cam.hal
# X vernier (docs/handoffs/2026-11-10-x-vernier-commissioning.md):
#   shadow mode = uncomment observe; closed loop = uncomment both. Needs the
#   module installed: sudo halcompile --install rtcomp/xvernier.comp
#HALFILE = x-vernier-observe.hal
#HALFILE = x-vernier-close.hal
HALFILE = custom.hal

[XVERNIER]
# X vernier estimator (rtcomp/xvernier.comp). Units: joint units = RADIUS inches.
# Calibrated values (H_INIT, LEAD, HARM_*, SLOPE, LAG_TIME, HYST) come from
# scripts/xvernier/fit_calibration.py on a sweep capture; zeros = uncalibrated.
H_INIT = 0.0
LEAD = 0.0
HARM_COS = 0.0
HARM_SIN = 0.0
SLOPE = 0.0
LAG_TIME = 0.0
HYST = 0.0
# learning gains: b0 per edge, backlash (0 = frozen at H_INIT), screw harmonic
ALPHA = 0.3
ALPHA_H = 0.0
ALPHA_HARM = 0.02
H_MAX = 0.002
# edges are used only when the steps moved less than this in that servo cycle
SPAN_MAX = 0.0001
# one-cycle forced correction that faults the axis; keep > 2*H_INIT + .0002
FAULT_LIMIT = 0.0005
# pid.x deadband when closed on the vernier (~0.6 motor step)
PID_DEADBAND = 0.00001

[HALUI]
# HALUI provides pins for UI interaction (jog, overrides, program control)

[TRAJ]
COORDINATES = X Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 0.5
DEFAULT_LINEAR_VELOCITY = 0.5
DEFAULT_LINEAR_ACCELERATION = 2.0
MAX_LINEAR_ACCELERATION = 2.0
# NO_FORCE_HOMING = 1 allows jogging without homing (for initial tuning)
NO_FORCE_HOMING = 1

# ============================================================================
# JOINT 0 — X AXIS (cross-slide)
# Closed-loop stepper with linear encoder feedback
# stepgen.01 on TB1 Step/Dir 1 (NOTE: reversed from joint numbering)
# ============================================================================
[JOINT_0]
TYPE = LINEAR
HOME = 4.25
# 2026-11-08: relaxed from -0.01 (owner) — no home switches; machine 0 is the
# power-up/home-in-place reference, see session-notes/2026-11-08-run-mode-and-limits.md
MIN_LIMIT = -0.05
# 2026-11-09: raised from 4.25 (owner). Machine units = RADIUS (5.95 r = 11.90" dia).
MAX_LIMIT = 5.95
MAX_VELOCITY = 1.7
MAX_ACCELERATION = 10.0
STEPGEN_MAXVEL = 1.8
STEPGEN_MAXACCEL = 12.5

# Step timing for UIRobot UIM8696PM integrated closed-loop stepper
# Negative STEP_SCALE: motor wiring drives carriage toward center on +stepgen; flip so +joint cmd = X+ (away from center) per lathe convention
STEP_SCALE = -54186.667
DIRSETUP = 20000
DIRHOLD = 20000
STEPLEN = 5000
STEPSPACE = 5000

# Sino KA300/KA500 linear encoder feedback (5µm resolution)
# Negative ENCODER_SCALE: paired with negative STEP_SCALE to keep loop stable AND give correct DRO direction (DRO decrements toward center)
ENCODER_SCALE = -5080

# PID tuning — INITIAL VALUES for first power-on
# Start conservative, tune up using the Tuning tab
P = 125
I = 0.0
D = .002
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = .0005
MAX_OUTPUT = 2.5
MAX_ERROR = 0.001

# Homing — TEST MODE (homes at current position, no switch search)
# Set HOME_SEARCH_VEL to ±0.5 when home switches are confirmed working
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0
HOME_IGNORE_LIMITS = YES

# Following error — MIN_FERROR must exceed leadscrew backlash (carriage stationary
# during backlash traversal while pos-cmd has already reversed direction).
# Measure actual backlash and tighten once backlash compensation is configured.
FERROR = 0.100
MIN_FERROR = 0.050

# ============================================================================
# JOINT 1 — Z AXIS (carriage)
# Closed-loop stepper with linear encoder feedback
# stepgen.00 on TB1 Step/Dir 0 (NOTE: reversed from joint numbering)
# ============================================================================
BACKLASH = 0.0
[JOINT_1]
TYPE = LINEAR
HOME = 0.0
# 2026-11-08: relaxed from +/-3.0 (owner) — no home switches; +/-5 around the
# power-up/home-in-place reference
MIN_LIMIT = -5.0
MAX_LIMIT = 5.0
# Hardware max vel = 100kHz / 27093 steps/in = 3.69 in/s (STEPLEN+STEPSPACE limit).
# STEPGEN_MAXVEL ≥ JOINT_MAX_VEL × 1.25 = 1.5 × 1.25 = 1.875; set to 2.0 for headroom.
MAX_VELOCITY = 1.5
MAX_ACCELERATION = 5
STEPGEN_MAXVEL = 2.0
STEPGEN_MAXACCEL = 8

# Step timing for UIRobot UIM8696PM integrated closed-loop stepper
# Negative STEP_SCALE: motor wiring drives carriage toward headstock on +stepgen; flip so +joint cmd = Z+ (toward tailstock) per lathe convention
STEP_SCALE = -27093.333
DIRSETUP = 20000
DIRHOLD = 20000
STEPLEN = 5000
STEPSPACE = 5000

# Sino KA300/KA500 linear encoder feedback (5µm resolution)
# Positive ENCODER_SCALE: Z rawcounts INCREASE when carriage moves toward tailstock; with negative STEP_SCALE this gives stable loop AND correct DRO direction (DRO increments toward tailstock)
ENCODER_SCALE = 5080

# PID tuning — velocity-mode stepgen with outer encoder loop. FF1=1.0 carries velocity.
# P and D provide light correction; I handles friction-induced drift.
P = 60
I = 0
D = .005
FF0 = 0.0
FF1 = 1.00
FF2 = 0.00
BIAS = 0.0
DEADBAND = 0.0002
MAX_OUTPUT = 5
MAX_ERROR = 0.010

# Homing — TEST MODE
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_OFFSET = 0.0
HOME_SEQUENCE = 1
HOME_IGNORE_LIMITS = YES

# Following error — MIN_FERROR must exceed Z backlash (measure before tightening further)
FERROR = 0.200
MIN_FERROR = 0.100

# ============================================================================
# AXIS definitions (map joints to axes)
# ============================================================================
BACKLASH = 0
[AXIS_X]
# 2026-11-08: relaxed from -0.01 (owner) — no home switches; machine 0 is the
# power-up/home-in-place reference, see session-notes/2026-11-08-run-mode-and-limits.md
MIN_LIMIT = -0.05
# 2026-11-09: raised from 4.25 (owner). Machine units = RADIUS (5.95 r = 11.90" dia).
MAX_LIMIT = 5.95
MAX_VELOCITY = 1.8
MAX_ACCELERATION = 10.0

[AXIS_Z]
# 2026-11-08: relaxed from +/-3.0 (owner) — no home switches; +/-5 around the
# power-up/home-in-place reference
MIN_LIMIT = -5.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 0.75
MAX_ACCELERATION = 2

# ============================================================================
# SPINDLE
# Manual motor — no VFD, no CNC speed control.
# Rotary encoder on 7i96s TB2 provides feedback for threading/CSS only.
# ============================================================================
[SPINDLE_0]
MAX_FORWARD_VELOCITY = 3000
# 2026-11-08: lowered from 100 (owner) — slowest gearbox speed is 64 RPM; at 100
# LinuxCNC raised S64 to 100 RPM commanded.
MIN_FORWARD_VELOCITY = 50
MAX_REVERSE_VELOCITY = 3000
MIN_REVERSE_VELOCITY = 100
HOME_SEARCH_VELOCITY = 0
ENCODER_SCALE = 4000

# ============================================================================
# Mesa board configuration
# ============================================================================
[EMCIO]
EMCIO = iov2
# Lathe: keep the commanded spindle ON through M6 (LinuxCNC default stops it).
# Without this, T1 M6 after S64 M3 left LinuxCNC commanding 0 RPM while the
# manual spindle kept turning, so spindle at-speed held the first feed move
# (bench 2026-11-08). LinuxCNC manual: "Useful for lathes".
TOOL_CHANGE_WITH_SPINDLE_ON = 1
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[MESA]
CARD0 = hm2_eth
BOARD = 7i96s
IP_ADDRESS = 192.168.1.121
